name: Update credits

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/contributors.py]

permissions:
  contents: write

jobs:
  credits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect contributors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/contributors.py
      - name: Save if changed
        run: |
          git diff --quiet contributors.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add contributors.json
          git commit -m "Update credits"
          git push
