  <g transform="translate(16 0) scale(.9 1)">
    <path fill="var(--reef-back)" stroke="var(--reef-leaf)" stroke-width="1.5" d="M198 245c-4-20 8-27 20-23 13-13 30 3 32 22-14 6-36 7-52 1Z"/>
    <g fill="var(--reef-leaf)" opacity=".5"><ellipse cx="105" cy="246" rx="4" ry="2"/><ellipse cx="118" cy="250" rx="2" ry="1"/><ellipse cx="297" cy="246" rx="4" ry="2"/></g>
  </g>
</svg>
