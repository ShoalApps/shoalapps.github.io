<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 180" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false" style="pointer-events:none">
  <!-- A continuous reef, including the centre cropped into view on phones. -->
