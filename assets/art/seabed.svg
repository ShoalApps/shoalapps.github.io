  </g>
  <g fill="var(--primary)" class="art-sway">
    <path d="M1053 149C1032 123 1053 105 1042 85 1030 62 1037 42 1052 32 1037 60 1067 73 1060 95 1053 119 1049 131 1068 148Z"/>
    <path d="M1075 149C1065 127 1089 114 1081 96 1074 81 1083 66 1098 62 1082 82 1106 92 1099 109 1092 127 1085 136 1089 150Z"/>
