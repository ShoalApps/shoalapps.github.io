  <g fill="var(--outline-variant)"><ellipse cx="112" cy="165" rx="5" ry="2"/><ellipse cx="247" cy="166" rx="4" ry="2"/><ellipse cx="393" cy="159" rx="6" ry="2"/><ellipse cx="409" cy="164" rx="3" ry="2"/><ellipse cx="685" cy="164" rx="5" ry="2"/><ellipse cx="773" cy="155" rx="4" ry="2"/><ellipse cx="1005" cy="162" rx="6" ry="2"/></g>
