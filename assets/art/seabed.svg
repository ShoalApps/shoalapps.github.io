    <path stroke-width="12" d="M628 145V63M628 113 603 94V65M603 84 588 72M628 92 650 74V44M650 65 667 55M628 78 618 65V46"/>
    <path stroke-width="14" d="M976 146V81M976 121 950 104V82M976 102 1001 83V57M1001 73 1016 61M976 88 964 75V62"/>
  </g>
  <!-- A broad, open sea fan keeps the central reef tall but airy. -->
  <path fill="var(--primary-container)" d="M451 141C432 122 400 93 404 65 407 44 427 48 437 61 431 36 451 22 464 38 475 15 498 29 493 52 514 39 530 54 520 76 510 101 477 125 464 143Z"/>
  <g fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M458 145 464 48M461 108 421 68M460 123 411 88M462 91 445 56M461 115 510 69M463 89 489 59M459 132 496 108"/>
  </g>
