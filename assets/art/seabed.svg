  <g fill="var(--primary)"><ellipse cx="790" cy="99" rx="7" ry="3"/><ellipse cx="822" cy="78" rx="8" ry="3.5"/><ellipse cx="850" cy="107" rx="7" ry="3"/></g>
  <!-- Kelp is rooted in the sand; the existing motion rules gently sway it. -->
  <g fill="var(--primary)" class="art-sway">
    <path d="M51 150C21 122 49 102 34 75 20 50 26 29 40 17 29 49 62 63 55 90 48 115 42 130 65 148Z"/>
    <path d="M69 150C61 122 85 109 75 89 65 69 77 49 92 44 76 67 100 82 94 101 88 124 79 133 83 150Z"/>
